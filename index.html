<body>

  <header class="topbar">

    <div class="brand">

      <div class="brand-mark">
        V
      </div>

      <div class="brand-text">

        <div class="brand-name">
          VIDHWAAN
        </div>

        <div class="brand-product">
          AIVidhya
        </div>

      </div>

    </div>


    <div class="course-meta">

      <span>
        365 Days
      </span>

      <span>
        AI Learning
      </span>

    </div>

  </header>


  <main>

    <section
      id="dayNavigator"
      class="day-navigator"
    >

      <div class="navigator-header">

        <div>

          <h1>
            AI విద్యా ప్రయాణం
          </h1>

          <p>
            రోజుకు ఒక పాఠం · ఉదయం 6:00 గంటలకు అందుబాటులోకి వస్తుంది
          </p>

        </div>


        <div
          id="todayLabel"
          class="today-label"
        >
          Loading...
        </div>

      </div>


      <div
        id="dayGrid"
        class="day-grid"
        aria-label="365 course days"
      ></div>

    </section>


    <section
      id="lessonView"
      class="lesson-view"
      hidden
    >

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        ← వెనక్కి
      </button>

      <div
        id="lessonContainer"
      ></div>

    </section>


    <section
      id="statusView"
      class="status-view"
      hidden
    >

      <div class="status-card">

        <div class="status-icon">
          !
        </div>

        <h2 id="statusTitle">
          పాఠం అందుబాటులో లేదు
        </h2>

        <p id="statusMessage"></p>

        <button
          id="statusBackButton"
          class="back-button"
          type="button"
        >
          ← వెనక్కి
        </button>

      </div>

    </section>

  </main>


  <footer class="site-footer">

    <strong>
      VIDHWAAN AIVidhya
    </strong>

    <span>
      365-Day AI Learning Journey
    </span>

  </footer>


  <!-- PWA INSTALL BUTTON -->

  <button
    id="pwaInstallButton"
    class="pwa-install-button"
    type="button"
    aria-label="Install VIDHWAAN AIVidhya"
    hidden
  >
    <span class="pwa-install-icon" aria-hidden="true">↓</span>
    <span class="pwa-install-text">
      <strong>Install AIVidhya</strong>
      <small>Use like an app</small>
    </span>
  </button>


  <script src="app.js" defer></script>


  <!-- PWA SERVICE WORKER -->

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js", {
            scope: "./"
          })
          .then(registration => {
            console.log(
              "VIDHWAAN AIVidhya service worker registered:",
              registration.scope
            );
          })
          .catch(error => {
            console.error(
              "Service worker registration failed:",
              error
            );
          });
      });
    }
  </script>

</body>
