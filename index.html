  >

    href="./icons/icon-192.png"
  >

    href="./manifest.json"
  >


  <!-- =====================================================

    href="./"
  >

  </title>

  >

    content="512"
  >

  >

       X / TWITTER
       ===================================================== -->

  <meta

    content="summary_large_image"
  >

  <meta
    name="twitter:title"

  >

  >

  >

    content="VIDHWAAN AIVidhya"
  >


  <!-- =====================================================
       STRUCTURED DATA
       ===================================================== -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "VIDHWAAN AIVidhya",
        "description": "A 365-day Artificial Intelligence learning journey.",
        "inLanguage": "te-IN"
      },
      {
        "@type": "EducationalOrganization",
        "name": "VIDHWAAN",
        "description": "Technology company providing accessible digital products and learning experiences."
      },
      {
        "@type": "Course",
        "name": "VIDHWAAN AIVidhya — 365-Day AI Learning Journey",
        "description": "A structured 365-day course covering Artificial Intelligence from foundational concepts to advanced topics and a final capstone.",
        "inLanguage": "te-IN",
        "provider": {
          "@type": "Organization",
          "name": "VIDHWAAN"
        },
        "educationalLevel": "Beginner to Advanced",
        "isAccessibleForFree": true
      }
    ]
  }
  </script>


  <!-- =====================================================
       MAIN STYLESHEET
       ===================================================== -->

  <link
    rel="stylesheet"
    href="main.css"
  >

</head>


<body>

  <div class="app-shell">


    <!-- ===================================================
         TOP NAVIGATION
         =================================================== -->

    <header class="topbar">

      <div class="topbar-inner">

        <button
          class="brand"
          id="brandButton"
          type="button"
          aria-label="VIDHWAAN AIVidhya home"
        >

          <img
            class="brand-logo"
            src="./icons/logo.png"
            alt="VIDHWAAN"
            width="44"
            height="44"
          >

          <span class="brand-copy">

            <span class="brand-name">
              VIDHWAAN
            </span>

            <span class="brand-product">
              AIVidhya
            </span>

          </span>

        </button>


        <div class="topbar-actions">

          <span class="topbar-pill">
            365 DAYS
          </span>

          <span class="topbar-pill topbar-pill-gold">
            AI LEARNING
          </span>

        </div>

      </div>

    </header>


    <!-- ===================================================
         MAIN CONTENT
         =================================================== -->

    <main id="mainContent">


      <!-- =================================================
           COURSE HOME
           ================================================= -->

      <section
        id="dayNavigator"
        class="day-navigator"
        aria-labelledby="courseTitle"
      >

        <div class="course-hero">

          <div class="course-hero-copy">

            <h1 id="courseTitle">
              AI విద్యా ప్రయాణం
            </h1>

            <p class="course-description">
              రోజుకు ఒక పాఠం · ప్రతిరోజూ ఉదయం 6:00 గంటలకు కొత్త పాఠం
            </p>

          </div>


          <div class="today-panel">

            <span class="today-panel-label">
              TODAY
            </span>

            <strong
              id="todayLabel"
              class="today-panel-date"
            >
              Loading...
            </strong>

          </div>

        </div>


        <!-- Day navigation -->

        <div class="days-heading">

          <div>

            <h2>
              Learning Days
            </h2>

          </div>

          <span class="days-count">
            1 — 365
          </span>

        </div>


        <div
          id="dayGrid"
          class="day-grid"
          aria-label="365 course days"
        ></div>


        <div class="navigator-note">

          <span
            class="navigator-note-dot"
            aria-hidden="true"
          ></span>

          <span>
            పాఠాలు వరుసగా ప్రతిరోజూ ఉదయం 6:00 గంటలకు అందుబాటులోకి వస్తాయి
          </span>

        </div>

      </section>


      <!-- =================================================
           LESSON VIEW
           ================================================= -->

      <section
        id="lessonView"
        class="lesson-view"
        hidden
        aria-live="polite"
      >

        <div class="lesson-topbar">

          <button
            id="backButton"
            class="back-button"
            type="button"
          >

            <span aria-hidden="true">
              ←
            </span>

            <span>
              అన్ని రోజులు
            </span>

          </button>


          <span
            id="lessonDayBadge"
            class="lesson-day-badge"
          >
            DAY
          </span>

        </div>


        <div
          id="lessonContainer"
          class="lesson-container"
        ></div>

      </section>


      <!-- =================================================
           STATUS VIEW
           ================================================= -->

      <section
        id="statusView"
        class="status-view"
        hidden
        aria-live="polite"
      >

        <div class="status-card">

          <div
            class="status-icon"
            aria-hidden="true"
          >
            !
          </div>

          <h2 id="statusTitle">
            పాఠం అందుబాటులో లేదు
          </h2>

          <p id="statusMessage"></p>

          <button
            id="statusBackButton"
            class="back-button"
            type="button"
          >

            <span aria-hidden="true">
              ←
            </span>

            <span>
              అన్ని రోజులు
            </span>

          </button>

        </div>

      </section>

    </main>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer class="site-footer">

      <div class="footer-inner">

        <div class="footer-brand">

          <img
            class="footer-logo"
            src="./icons/logo.png"
            alt="VIDHWAAN"
            width="40"
            height="40"
          >

          <div class="footer-brand-copy">

            <strong>
              VIDHWAAN
            </strong>

            <span>
              AIVidhya
            </span>

          </div>

        </div>


        <div class="footer-copyright">
          © VIDHWAAN
        </div>

      </div>

    </footer>

  </div>


  <!-- =====================================================
       PWA INSTALL BUTTON
       ===================================================== -->

  <button
    id="pwaInstallButton"
    class="pwa-install-button"
    type="button"
    aria-label="Install VIDHWAAN AIVidhya"
    hidden
  >

    <span
      class="pwa-install-icon"
      aria-hidden="true"
    >
      ↓
    </span>

    <span class="pwa-install-text">

      <strong>
        Install AIVidhya
      </strong>

      <small>
        Use like an app
      </small>

    </span>

  </button>


  <!-- =====================================================
       APPLICATION JAVASCRIPT
       ===================================================== -->

  <script
    src="app.js"
    defer
  ></script>


  <!-- =====================================================
       SERVICE WORKER
       ===================================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js", {
            scope: "./"
          })
          .then(registration => {

            console.log(
              "VIDHWAAN AIVidhya service worker registered:",
              registration.scope
            );

          })
          .catch(error => {

            console.error(
              "Service worker registration failed:",
              error
            );

          });

      });

    }

  </script>


</body>
</html>
